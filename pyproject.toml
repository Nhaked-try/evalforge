[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.3.1"
description = "Local-first, GPU-accelerated LLM evaluation & benchmarking toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nhaked-try", email = "Nhaked-try@users.noreply.github.com"}
]
keywords = [
    "llm-evaluation",
    "benchmarking",
    "model-comparison",
    "elo-rating",
    "nlp",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "click>=8.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.5.0",
    "torch>=2.3.0",
    "flash-attn>=2.5.0",
    "xformers>=0.0.26",
    "sentence-transformers>=3.0.0",
    "optimum>=1.19.0",
    "auto-gptq>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "black>=24.0.0",
]

[project.scripts]
evalforge = "evalforge.cli:app"

[project.urls]
Homepage = "https://github.com/Nhaked-try/evalforge"
Repository = "https://github.com/Nhaked-try/evalforge"
Issues = "https://github.com/Nhaked-try/evalforge/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
